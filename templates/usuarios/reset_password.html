{% extends 'base_auth.html' %}
{% load static %}
{% block title %}Nueva Contraseña{% endblock %}
{% block content %}
<h2 class="form-title">Nueva Contraseña</h2>
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="token" value="{{ token }}">
  <div class="form-group">
    <label>Nueva contraseña</label>
    <input type="password" name="password1" id="id_password1" class="form-control" required>
    <div class="password-meter"><div class="meter-bar" id="meter-bar"></div></div>
    <span class="meter-label" id="meter-label"></span>
  </div>
  <div class="form-group">
    <label>Confirmar contraseña</label>
    <input type="password" name="password2" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary btn-full">Guardar contraseña</button>
</form>
<script src="{% static 'js/password_meter.js' %}"></script>
{% endblock %}
