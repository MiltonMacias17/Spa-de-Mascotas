{% extends 'base_auth.html' %}
{% block title %}Recuperar Contraseña{% endblock %}
{% block content %}
<h2 class="form-title">Recuperar Contraseña</h2>
<p class="form-desc">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
<form method="post">
  {% csrf_token %}
  <div class="form-group">
    <label>Correo electrónico</label>
    {{ form.email }}
  </div>
  <button type="submit" class="btn btn-primary btn-full">Enviar enlace</button>
</form>
<div class="auth-links"><a href="{% url 'usuarios:login' %}">Volver al login</a></div>
{% endblock %}
